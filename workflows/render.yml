name: Render Automated Video
on:
  repository_dispatch:
    types: [trigger-render]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgbm-dev libnss3 libatk-bridge2.0-0 libgtk-3-0

      - name: Install Project Dependencies
        run: npm install

      - name: Render Remotion Video
        run: |
          npx remotion render src/index.ts MainComposition out/short.mp4 \
            --props='{"audioUrl":"${{ github.event.client_payload.audioUrl }}","text":"${{ github.event.client_payload.text }}"}'

      - name: Upload Finished Video to Cloud Storage
        env:
          DRIVE_FOLDER_ID: ${{ secrets.YOUR_GOOGLE_DRIVE_FOLDER_ID }}
        run: node scripts/upload-to-drive.js
