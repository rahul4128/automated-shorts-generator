name: Render Automated Video
on:
  repository_dispatch:
    types: [trigger-render]

concurrency:
  group: render-automated-video
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SCRIPT_TEXT: ${{ github.event.client_payload.scriptText }}
      IMAGE_URL: ${{ github.event.client_payload.imageUrl }}
      IMAGE_PROMPTS_JSON: ${{ toJSON(github.event.client_payload.imagePrompts) }}
      VIDEO_TITLE: ${{ github.event.client_payload.title }}
      VIDEO_DESCRIPTION: ${{ github.event.client_payload.description }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache node_modules and pip downloads
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/pip
          key: deps-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-
      - name: Cache static ffmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/ffmpeg-static
          key: ffmpeg-static-amd64-v1
      - name: Install ffmpeg (static binary, no apt)
        run: |
          if [ ! -x /usr/local/bin/ffmpeg-static/ffmpeg ]; then
            mkdir -p /usr/local/bin/ffmpeg-static
            curl -fL --retry 3 --retry-delay 2 --max-time 120 \
              -o /tmp/ffmpeg.tar.xz \
              "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp
            cp /tmp/ffmpeg-*-amd64-static/ffmpeg /tmp/ffmpeg-*-amd64-static/ffprobe /usr/local/bin/ffmpeg-static/
          fi
          echo "/usr/local/bin/ffmpeg-static" >> "$GITHUB_PATH"
        timeout-minutes: 3
      - name: Verify ffmpeg
        run: ffmpeg -version | head -n1
      - name: Cache Piper voice model
        id: cache-voice-model
        uses: actions/cache@v4
        with:
          path: models
          key: piper-voice-hi_IN-rohan-medium-v1
      - name: Download Hindi voice model
        if: steps.cache-voice-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fL --retry 3 --retry-delay 2 --max-time 120 \
            -o models/hi_IN-rohan-medium.onnx \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/rohan/medium/hi_IN-rohan-medium.onnx"
          curl -fL --retry 3 --retry-delay 2 --max-time 60 \
            -o models/hi_IN-rohan-medium.onnx.json \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/rohan/medium/hi_IN-rohan-medium.onnx.json"
        timeout-minutes: 5
      - name: Install npm and pip dependencies (parallel)
        run: |
          set -e
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci &
          else
            npm install &
          fi
          NPM_PID=$!
          pip install --disable-pip-version-check piper-tts &
          PIP_PID=$!
          wait $NPM_PID
          wait $PIP_PID
        timeout-minutes: 6
      - name: Download scene images
        run: |
          mkdir -p public/images out
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const https = require('https');

          let prompts = [];
          try {
            prompts = JSON.parse(process.env.IMAGE_PROMPTS_JSON || '[]');
          } catch (e) {
            prompts = [];
          }
          if (!Array.isArray(prompts) || prompts.length === 0) {
            prompts = [''];
          }

          function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
          }

          // Generic HTTPS GET with retry/backoff on 429/5xx (honoring
          // Retry-After when present) and a per-request timeout so a hung
          // connection doesn't block forever.
          function get(url, attempt = 1, maxAttempts = 6) {
            return new Promise((resolve, reject) => {
              const req = https
                .get(url, { headers: { 'User-Agent': 'automated-shorts-generator/1.0 (GitHub Actions render workflow)' } }, (res) => {
                  const isRetryableStatus =
                    res.statusCode === 429 || res.statusCode >= 500;
                  if (res.statusCode !== 200) {
                    res.resume();
                    if (attempt < maxAttempts && (isRetryableStatus || attempt < 3)) {
                      const retryAfterSec = parseInt(res.headers['retry-after'] || '', 10);
                      const backoffMs = Number.isFinite(retryAfterSec)
                        ? retryAfterSec * 1000
                        : Math.min(30000, 2000 * 2 ** (attempt - 1));
                      console.log(
                        `${url.split('?')[0]} -> ${res.statusCode}, retrying in ${backoffMs}ms (attempt ${attempt}/${maxAttempts})`
                      );
                      return sleep(backoffMs).then(() =>
                        resolve(get(url, attempt + 1, maxAttempts))
                      );
                    }
                    return reject(new Error(`Failed ${url}: ${res.statusCode}`));
                  }
                  const chunks = [];
                  res.on('data', (c) => chunks.push(c));
                  res.on('end', () => resolve(Buffer.concat(chunks)));
                })
                .on('error', (err) => {
                  if (attempt < maxAttempts) {
                    const backoffMs = Math.min(30000, 2000 * 2 ** (attempt - 1));
                    return sleep(backoffMs).then(() =>
                      resolve(get(url, attempt + 1, maxAttempts))
                    );
                  }
                  reject(err);
                });
              req.setTimeout(60000, () => {
                req.destroy(new Error('timeout'));
              });
            });
          }

          async function downloadToFile(url, dest) {
            const buf = await get(url);
            fs.writeFileSync(dest, buf);
          }

          // Lexica sits behind an anti-bot edge (Cloudflare-style) that
          // resets the TLS handshake for GitHub Actions' datacenter IP
          // ranges — a documented, unfixable-from-our-side problem, not a
          // query/rate-limit issue. Wikimedia Commons is a better fit for
          // CI: it's a free, keyless, script-friendly API (Wikimedia
          // explicitly documents bot access; it just asks for a
          // descriptive User-Agent, set above) backed by its own CDN
          // rather than a third-party bot wall, and it has a huge library
          // of public-domain/CC devotional and mythological art.
          async function searchCommons(query) {
            const url =
              'https://commons.wikimedia.org/w/api.php?action=query&generator=search' +
              `&gsrsearch=${encodeURIComponent(query)}&gsrnamespace=6&gsrlimit=8` +
              '&prop=imageinfo&iiprop=url|mime&iiurlwidth=1080&format=json';
            const buf = await get(url);
            const data = JSON.parse(buf.toString('utf8'));
            const pages = (data.query && data.query.pages) || {};
            return Object.values(pages);
          }

          function shortenQuery(query) {
            // Commons full-text search works best on a handful of keywords
            // rather than a long, comma-separated cinematic prompt. Fall
            // back to progressively shorter/simpler queries if a full
            // prompt returns no matches.
            const firstClause = query.split(',')[0];
            const words = firstClause.trim().split(/\s+/).slice(0, 6).join(' ');
            return words;
          }

          async function findImageUrl(promptRaw, i) {
            const prompt =
              promptRaw || 'devotional cinematic scene, warm lighting';
            const candidates = [
              prompt,
              shortenQuery(prompt),
              'Hindu mythology painting',
            ];
            for (const query of candidates) {
              if (!query) continue;
              let pages = [];
              try {
                pages = await searchCommons(query);
              } catch (err) {
                console.log(`Commons search failed for "${query.slice(0, 60)}": ${err.message}`);
                continue;
              }
              const usable = pages
                .map((p) => p.imageinfo && p.imageinfo[0])
                .filter((info) => info && (info.mime === 'image/jpeg' || info.mime === 'image/png'))
                .map((info) => info.thumburl || info.url);
              if (usable.length > 0) {
                console.log(`Scene ${i}: matched "${query.slice(0, 60)}" (${usable.length} results)`);
                return usable[i % usable.length];
              }
            }
            throw new Error(`No Commons results for scene ${i}`);
          }

          // Keep concurrency modest and stagger requests slightly to be a
          // good citizen of a free, keyless API.
          async function mapWithConcurrency(items, limit, fn) {
            const results = new Array(items.length);
            let next = 0;
            async function worker(workerIndex) {
              await sleep(workerIndex * 1000);
              while (next < items.length) {
                const i = next++;
                results[i] = await fn(items[i], i);
              }
            }
            await Promise.all(
              Array.from({ length: Math.min(limit, items.length) }, (_, w) => worker(w))
            );
            return results;
          }

          (async () => {
            const relPaths = new Array(prompts.length);
            await mapWithConcurrency(prompts, 3, async (promptRaw, i) => {
              const imgUrl = await findImageUrl(promptRaw, i);
              const rel = `images/scene-${i}.jpg`;
              await downloadToFile(imgUrl, path.join('public', rel));
              relPaths[i] = rel;
              console.log(`Downloaded scene ${i}: ${(promptRaw || '').slice(0, 60)}`);
            });
            fs.writeFileSync('out/images.json', JSON.stringify(relPaths));
            fs.copyFileSync(path.join('public', relPaths[0]), 'out/thumbnail.jpg');
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF
        timeout-minutes: 12
      - name: Synthesize Hindi audio with Piper
        run: |
          mkdir -p public
          printf '%s' "$SCRIPT_TEXT" | piper \
            --model models/hi_IN-rohan-medium.onnx \
            --output_file public/audio.wav
        timeout-minutes: 3
      - name: Cache Remotion browser binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            remotion-browser-${{ runner.os }}-
      - name: Render video
        run: |
          npx remotion render src/index.ts ShortVideo out/video.mp4 \
            --props="$(node -e 'const fs=require("fs");const images=JSON.parse(fs.readFileSync("out/images.json","utf8"));console.log(JSON.stringify({images}))')"
        timeout-minutes: 8
      - name: Upload video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4
      - name: Create release with video, title, description, and thumbnail
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_id }}
          name: ${{ env.VIDEO_TITLE }}
          body: ${{ env.VIDEO_DESCRIPTION }}
          files: |
            out/video.mp4
            out/thumbnail.jpg
