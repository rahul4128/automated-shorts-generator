name: Render Automated Video
on:
  repository_dispatch:
    types: [trigger-render]
  # Manual/test trigger — lets you run this from the Actions tab (or `gh
  # workflow run render.yml`) without needing whatever external process
  # normally fires the repository_dispatch event. All inputs have sensible
  # defaults, so you can just hit "Run workflow" with no changes to smoke
  # test the pipeline (image search, TTS, render, release).
  workflow_dispatch:
    inputs:
      scriptText:
        description: "Hindi narration script for Piper TTS"
        required: false
        default: "श्री राम की महिमा अपरंपार है। हनुमान जी की भक्ति और सेवा सबसे बड़ी शक्ति है।"
      imagePrompts:
        description: "JSON array of per-scene image generation prompts"
        required: false
        default: '["Rama and Sita in a forest, cinematic warm lighting, vertical", "Hanuman kneeling in devotion, golden hour, vertical", "Ramayana temple scene, devotional, vertical"]'
      title:
        description: "Video title"
        required: false
        default: "Manual Test Render"
      description:
        description: "Video description"
        required: false
        default: "Manual test run triggered via workflow_dispatch"

concurrency:
  group: render-automated-video
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Falls back to the workflow_dispatch input of the same name when
      # there's no repository_dispatch client_payload (i.e. a manual run).
      SCRIPT_TEXT: ${{ github.event.client_payload.scriptText || github.event.inputs.scriptText }}
      IMAGE_URL: ${{ github.event.client_payload.imageUrl }}
      IMAGE_PROMPTS_JSON: ${{ (github.event.client_payload.imagePrompts && toJSON(github.event.client_payload.imagePrompts)) || github.event.inputs.imagePrompts }}
      VIDEO_TITLE: ${{ github.event.client_payload.title || github.event.inputs.title || 'Automated Video' }}
      VIDEO_DESCRIPTION: ${{ github.event.client_payload.description || github.event.inputs.description || '' }}
      # Hugging Face access token with "Make calls to Inference Providers"
      # permission — create one at huggingface.co/settings/tokens and add
      # it as a repo secret named HF_TOKEN (Settings -> Secrets and
      # variables -> Actions -> New repository secret).
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache node_modules and pip downloads
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/pip
          key: deps-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-
      - name: Cache static ffmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/ffmpeg-static
          key: ffmpeg-static-amd64-v1
      - name: Install ffmpeg (static binary, no apt)
        run: |
          if [ ! -x /usr/local/bin/ffmpeg-static/ffmpeg ]; then
            mkdir -p /usr/local/bin/ffmpeg-static
            curl -fL --retry 3 --retry-delay 2 --max-time 120 \
              -o /tmp/ffmpeg.tar.xz \
              "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp
            cp /tmp/ffmpeg-*-amd64-static/ffmpeg /tmp/ffmpeg-*-amd64-static/ffprobe /usr/local/bin/ffmpeg-static/
          fi
          echo "/usr/local/bin/ffmpeg-static" >> "$GITHUB_PATH"
        timeout-minutes: 3
      - name: Verify ffmpeg
        run: ffmpeg -version | head -n1
      - name: Cache Piper voice model
        id: cache-voice-model
        uses: actions/cache@v4
        with:
          path: models
          key: piper-voice-hi_IN-rohan-medium-v1
      - name: Download Hindi voice model
        if: steps.cache-voice-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fL --retry 3 --retry-delay 2 --max-time 120 \
            -o models/hi_IN-rohan-medium.onnx \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/rohan/medium/hi_IN-rohan-medium.onnx"
          curl -fL --retry 3 --retry-delay 2 --max-time 60 \
            -o models/hi_IN-rohan-medium.onnx.json \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/rohan/medium/hi_IN-rohan-medium.onnx.json"
        timeout-minutes: 5
      - name: Install npm and pip dependencies (parallel)
        run: |
          set -e
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci &
          else
            npm install &
          fi
          NPM_PID=$!
          pip install --disable-pip-version-check piper-tts &
          PIP_PID=$!
          wait $NPM_PID
          wait $PIP_PID
        timeout-minutes: 6
      - name: Generate scene images
        run: |
          mkdir -p public/images out
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const https = require('https');

          let prompts = [];
          try {
            prompts = JSON.parse(process.env.IMAGE_PROMPTS_JSON || '[]');
          } catch (e) {
            prompts = [];
          }
          if (!Array.isArray(prompts) || prompts.length === 0) {
            prompts = [''];
          }

          const HF_TOKEN = process.env.HF_TOKEN;
          // stable-diffusion-2 is Hugging Face's own documented default for
          // this task on their first-party "hf-inference" backend (the
          // route used below). Newer/faster models like FLUX.1-schnell are
          // often only hosted through third-party providers (fal-ai,
          // replicate, etc.) with a different request shape, so they're
          // not a drop-in override here without also changing the URL —
          // stick with this default unless you've confirmed another
          // model's provider and request format.
          const HF_MODEL = process.env.HF_IMAGE_MODEL || 'stabilityai/stable-diffusion-2';

          if (!HF_TOKEN) {
            console.error(
              'HF_TOKEN is not set. Create a token at huggingface.co/settings/tokens ' +
                '(with "Make calls to Inference Providers" permission) and add it as a ' +
                'repo secret named HF_TOKEN.'
            );
            process.exit(1);
          }

          function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
          }

          // Unlike a keyless search API over an existing image collection
          // (Wikimedia, the Met), this actually generates a new image from
          // the prompt — so scenes match the script instead of being the
          // closest pre-existing photo/artwork we could find. Billed
          // per-account against Hugging Face's Inference Providers credit,
          // so it isn't subject to GitHub Actions' shared-IP rate limits
          // the way anonymous services were.
          //
          // A cold model returns 503 with an `estimated_time` (seconds)
          // hint in the JSON body — honor that instead of guessing a
          // backoff. Real quota/error responses (401 bad token, 402 out of
          // credits, etc.) are not retried.
          function generateImage(prompt, attempt = 1, maxAttempts = 6) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({
                inputs: prompt || 'devotional cinematic scene, warm lighting',
              });
              const req = https.request(
                `https://router.huggingface.co/hf-inference/models/${HF_MODEL}`,
                {
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${HF_TOKEN}`,
                    'Content-Type': 'application/json',
                    'Content-Length': Buffer.byteLength(body),
                  },
                },
                (res) => {
                  const chunks = [];
                  res.on('data', (c) => chunks.push(c));
                  res.on('end', () => {
                    const buf = Buffer.concat(chunks);
                    const contentType = res.headers['content-type'] || '';
                    if (res.statusCode === 200 && contentType.startsWith('image/')) {
                      return resolve(buf);
                    }

                    let hintSeconds = null;
                    let errMessage = `HTTP ${res.statusCode}`;
                    try {
                      const parsed = JSON.parse(buf.toString('utf8'));
                      if (parsed && typeof parsed.estimated_time === 'number') {
                        hintSeconds = parsed.estimated_time;
                      }
                      if (parsed && parsed.error) errMessage = parsed.error;
                    } catch (e) {
                      // Non-JSON error body — keep the generic HTTP status message.
                    }

                    const isRetryable =
                      res.statusCode === 429 || res.statusCode === 503 || res.statusCode >= 500;
                    if (attempt < maxAttempts && isRetryable) {
                      const backoffMs = hintSeconds
                        ? Math.ceil(hintSeconds * 1000) + 1000
                        : Math.min(30000, 3000 * 2 ** (attempt - 1));
                      console.log(
                        `HF generate -> ${errMessage}, retrying in ${backoffMs}ms (attempt ${attempt}/${maxAttempts})`
                      );
                      return sleep(backoffMs).then(() =>
                        resolve(generateImage(prompt, attempt + 1, maxAttempts))
                      );
                    }
                    return reject(new Error(`HF generate failed: ${errMessage}`));
                  });
                }
              );
              req.on('error', (err) => {
                if (attempt < maxAttempts) {
                  const backoffMs = Math.min(30000, 3000 * 2 ** (attempt - 1));
                  return sleep(backoffMs).then(() =>
                    resolve(generateImage(prompt, attempt + 1, maxAttempts))
                  );
                }
                reject(err);
              });
              req.setTimeout(120000, () => {
                req.destroy(new Error('timeout'));
              });
              req.write(body);
              req.end();
            });
          }

          // A couple of concurrent generations at a time — this is billed,
          // compute-heavy work per request, not a free bulk API, so there's
          // no need (or benefit) to hammer it with high concurrency.
          async function mapWithConcurrency(items, limit, fn) {
            const results = new Array(items.length);
            let next = 0;
            async function worker(workerIndex) {
              await sleep(workerIndex * 500);
              while (next < items.length) {
                const i = next++;
                results[i] = await fn(items[i], i);
              }
            }
            await Promise.all(
              Array.from({ length: Math.min(limit, items.length) }, (_, w) => worker(w))
            );
            return results;
          }

          (async () => {
            const relPaths = new Array(prompts.length);
            await mapWithConcurrency(prompts, 2, async (promptRaw, i) => {
              const buf = await generateImage(promptRaw);
              const rel = `images/scene-${i}.jpg`;
              fs.writeFileSync(path.join('public', rel), buf);
              relPaths[i] = rel;
              console.log(`Generated scene ${i}: ${(promptRaw || '').slice(0, 60)}`);
            });
            fs.writeFileSync('out/images.json', JSON.stringify(relPaths));
            fs.copyFileSync(path.join('public', relPaths[0]), 'out/thumbnail.jpg');
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF
        timeout-minutes: 12
      - name: Synthesize Hindi audio with Piper
        run: |
          mkdir -p public
          printf '%s' "$SCRIPT_TEXT" | piper \
            --model models/hi_IN-rohan-medium.onnx \
            --output_file public/audio.wav
        timeout-minutes: 3
      - name: Cache Remotion browser binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            remotion-browser-${{ runner.os }}-
      - name: Render video
        run: |
          npx remotion render src/index.ts ShortVideo out/video.mp4 \
            --props="$(node -e 'const fs=require("fs");const images=JSON.parse(fs.readFileSync("out/images.json","utf8"));console.log(JSON.stringify({images}))')"
        timeout-minutes: 8
      - name: Upload video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4
      - name: Create release with video, title, description, and thumbnail
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_id }}
          name: ${{ env.VIDEO_TITLE }}
          body: ${{ env.VIDEO_DESCRIPTION }}
          files: |
            out/video.mp4
            out/thumbnail.jpg
