name: Render Automated Video
on:
  repository_dispatch:
    types: [trigger-render]
  # Manual/test trigger — lets you run this from the Actions tab (or `gh
  # workflow run render.yml`) without needing whatever external process
  # normally fires the repository_dispatch event. All inputs have sensible
  # defaults, so you can just hit "Run workflow" with no changes to smoke
  # test the pipeline (image search, TTS, render, release).
  workflow_dispatch:
    inputs:
      scriptText:
        description: "Hindi narration script for Piper TTS"
        required: false
        default: "श्री राम की महिमा अपरंपार है। हनुमान जी की भक्ति और सेवा सबसे बड़ी शक्ति है।"
      imagePrompts:
        description: "JSON array of per-scene image search prompts"
        required: false
        default: '["Rama and Sita painting", "Hanuman devotion painting", "Ramayana temple scene"]'
      title:
        description: "Video title"
        required: false
        default: "Manual Test Render"
      description:
        description: "Video description"
        required: false
        default: "Manual test run triggered via workflow_dispatch"

concurrency:
  group: render-automated-video
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Falls back to the workflow_dispatch input of the same name when
      # there's no repository_dispatch client_payload (i.e. a manual run).
      SCRIPT_TEXT: ${{ github.event.client_payload.scriptText || github.event.inputs.scriptText }}
      IMAGE_URL: ${{ github.event.client_payload.imageUrl }}
      IMAGE_PROMPTS_JSON: ${{ (github.event.client_payload.imagePrompts && toJSON(github.event.client_payload.imagePrompts)) || github.event.inputs.imagePrompts }}
      VIDEO_TITLE: ${{ github.event.client_payload.title || github.event.inputs.title || 'Automated Video' }}
      VIDEO_DESCRIPTION: ${{ github.event.client_payload.description || github.event.inputs.description || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache node_modules and pip downloads
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/pip
          key: deps-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-
      - name: Cache static ffmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/ffmpeg-static
          key: ffmpeg-static-amd64-v1
      - name: Install ffmpeg (static binary, no apt)
        run: |
          if [ ! -x /usr/local/bin/ffmpeg-static/ffmpeg ]; then
            mkdir -p /usr/local/bin/ffmpeg-static
            curl -fL --retry 3 --retry-delay 2 --max-time 120 \
              -o /tmp/ffmpeg.tar.xz \
              "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp
            cp /tmp/ffmpeg-*-amd64-static/ffmpeg /tmp/ffmpeg-*-amd64-static/ffprobe /usr/local/bin/ffmpeg-static/
          fi
          echo "/usr/local/bin/ffmpeg-static" >> "$GITHUB_PATH"
        timeout-minutes: 3
      - name: Verify ffmpeg
        run: ffmpeg -version | head -n1
      - name: Cache Piper voice model
        id: cache-voice-model
        uses: actions/cache@v4
        with:
          path: models
          key: piper-voice-hi_IN-rohan-medium-v1
      - name: Download Hindi voice model
        if: steps.cache-voice-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fL --retry 3 --retry-delay 2 --max-time 120 \
            -o models/hi_IN-rohan-medium.onnx \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/rohan/medium/hi_IN-rohan-medium.onnx"
          curl -fL --retry 3 --retry-delay 2 --max-time 60 \
            -o models/hi_IN-rohan-medium.onnx.json \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/rohan/medium/hi_IN-rohan-medium.onnx.json"
        timeout-minutes: 5
      - name: Install npm and pip dependencies (parallel)
        run: |
          set -e
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci &
          else
            npm install &
          fi
          NPM_PID=$!
          pip install --disable-pip-version-check piper-tts &
          PIP_PID=$!
          wait $NPM_PID
          wait $PIP_PID
        timeout-minutes: 6
      - name: Download scene images
        run: |
          mkdir -p public/images out
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const https = require('https');

          let prompts = [];
          try {
            prompts = JSON.parse(process.env.IMAGE_PROMPTS_JSON || '[]');
          } catch (e) {
            prompts = [];
          }
          if (!Array.isArray(prompts) || prompts.length === 0) {
            prompts = [''];
          }

          function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
          }

          // Generic HTTPS GET with retry/backoff on 429/5xx (honoring
          // Retry-After when present) and a per-request timeout so a hung
          // connection doesn't block forever.
          function get(url, opts = {}) {
            const {
              attempt = 1,
              maxAttempts = 6,
              baseBackoffMs = 2000,
              capBackoffMs = 30000,
            } = opts;
            return new Promise((resolve, reject) => {
              const req = https
                .get(url, { headers: { 'User-Agent': 'automated-shorts-generator/1.0 (GitHub Actions render workflow)' } }, (res) => {
                  const isRetryableStatus =
                    res.statusCode === 429 || res.statusCode >= 500;
                  if (res.statusCode !== 200) {
                    res.resume();
                    if (attempt < maxAttempts && (isRetryableStatus || attempt < 3)) {
                      const retryAfterSec = parseInt(res.headers['retry-after'] || '', 10);
                      const backoffMs = Number.isFinite(retryAfterSec)
                        ? retryAfterSec * 1000
                        : Math.min(capBackoffMs, baseBackoffMs * 2 ** (attempt - 1));
                      console.log(
                        `${url.split('?')[0]} -> ${res.statusCode}, retrying in ${backoffMs}ms (attempt ${attempt}/${maxAttempts})`
                      );
                      return sleep(backoffMs).then(() =>
                        resolve(get(url, { ...opts, attempt: attempt + 1 }))
                      );
                    }
                    return reject(new Error(`Failed ${url}: ${res.statusCode}`));
                  }
                  const chunks = [];
                  res.on('data', (c) => chunks.push(c));
                  res.on('end', () => resolve(Buffer.concat(chunks)));
                })
                .on('error', (err) => {
                  if (attempt < maxAttempts) {
                    const backoffMs = Math.min(capBackoffMs, baseBackoffMs * 2 ** (attempt - 1));
                    return sleep(backoffMs).then(() =>
                      resolve(get(url, { ...opts, attempt: attempt + 1 }))
                    );
                  }
                  reject(err);
                });
              req.setTimeout(60000, () => {
                req.destroy(new Error('timeout'));
              });
            });
          }

          async function downloadToFile(url, dest) {
            const buf = await get(url, {
              maxAttempts: 6,
              baseBackoffMs: 2000,
              capBackoffMs: 15000,
            });
            fs.writeFileSync(dest, buf);
          }

          // Wikimedia has been publicly fighting a surge in automated/AI
          // crawler traffic since 2025 and has responded by throttling
          // datacenter/bot-like traffic much harder — which is why both
          // its search API and its image CDN kept 429ing GitHub Actions'
          // shared runner IPs no matter how much we slowed down. The Met
          // Museum's Open Access API is a better fit for CI: it's free,
          // keyless, explicitly built and scaled for open bulk/
          // programmatic reuse (no crawler crackdown to get caught in),
          // and its Asian Art department holds a large collection of
          // Ramayana and Hindu devotional paintings/sculpture.
          async function searchMet(query) {
            const url = `https://collectionapi.metmuseum.org/public/collection/v1/search?hasImages=true&q=${encodeURIComponent(query)}`;
            const buf = await get(url);
            const data = JSON.parse(buf.toString('utf8'));
            return Array.isArray(data.objectIDs) ? data.objectIDs : [];
          }

          async function getMetObject(id) {
            const url = `https://collectionapi.metmuseum.org/public/collection/v1/objects/${id}`;
            const buf = await get(url);
            return JSON.parse(buf.toString('utf8'));
          }

          function shortenQuery(query) {
            // The Met's search works best on a handful of keywords rather
            // than a long, comma-separated cinematic prompt. Fall back to
            // progressively shorter/simpler queries if a full prompt
            // returns no matches.
            const firstClause = query.split(',')[0];
            const words = firstClause.trim().split(/\s+/).slice(0, 6).join(' ');
            return words;
          }

          async function findImageUrl(promptRaw, i) {
            const prompt =
              promptRaw || 'devotional cinematic scene, warm lighting';
            const candidates = [
              prompt,
              shortenQuery(prompt),
              'Ramayana painting',
              'Hindu deity sculpture',
            ];
            for (const query of candidates) {
              if (!query) continue;
              let objectIDs = [];
              try {
                objectIDs = await searchMet(query);
              } catch (err) {
                console.log(`Met search failed for "${query.slice(0, 60)}": ${err.message}`);
                continue;
              }
              if (objectIDs.length === 0) continue;
              // Only check a handful of candidates per query — enough to
              // find a usable public-domain image without fetching every
              // match's full detail record.
              const details = await mapWithConcurrency(objectIDs.slice(0, 6), 3, async (id) => {
                try {
                  return await getMetObject(id);
                } catch (err) {
                  return null;
                }
              });
              const usable = details
                .filter((d) => d && d.isPublicDomain && (d.primaryImageSmall || d.primaryImage))
                .map((d) => d.primaryImageSmall || d.primaryImage);
              if (usable.length > 0) {
                console.log(`Scene ${i}: matched "${query.slice(0, 60)}" (${usable.length} usable)`);
                return usable[i % usable.length];
              }
            }
            throw new Error(`No Met Museum results for scene ${i}`);
          }

          // Keep concurrency modest and stagger requests slightly to be a
          // good citizen of a free, keyless API.
          async function mapWithConcurrency(items, limit, fn) {
            const results = new Array(items.length);
            let next = 0;
            async function worker(workerIndex) {
              await sleep(workerIndex * 1000);
              while (next < items.length) {
                const i = next++;
                results[i] = await fn(items[i], i);
              }
            }
            await Promise.all(
              Array.from({ length: Math.min(limit, items.length) }, (_, w) => worker(w))
            );
            return results;
          }

          (async () => {
            // Phase 1: resolve a source image URL per scene by searching
            // the Met Museum's collection (collectionapi.metmuseum.org).
            const imageUrls = await mapWithConcurrency(prompts, 3, (promptRaw, i) =>
              findImageUrl(promptRaw, i)
            );

            // Phase 2: download the actual image bytes serially, with a
            // fixed gap between requests on top of per-request retry/
            // backoff, to stay a good citizen of the image CDN
            // (images.metmuseum.org).
            const relPaths = new Array(prompts.length);
            for (let i = 0; i < imageUrls.length; i++) {
              if (i > 0) await sleep(1000);
              const rel = `images/scene-${i}.jpg`;
              await downloadToFile(imageUrls[i], path.join('public', rel));
              relPaths[i] = rel;
              console.log(`Downloaded scene ${i}: ${(prompts[i] || '').slice(0, 60)}`);
            }

            fs.writeFileSync('out/images.json', JSON.stringify(relPaths));
            fs.copyFileSync(path.join('public', relPaths[0]), 'out/thumbnail.jpg');
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF
        timeout-minutes: 12
      - name: Synthesize Hindi audio with Piper
        run: |
          mkdir -p public
          printf '%s' "$SCRIPT_TEXT" | piper \
            --model models/hi_IN-rohan-medium.onnx \
            --output_file public/audio.wav
        timeout-minutes: 3
      - name: Cache Remotion browser binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            remotion-browser-${{ runner.os }}-
      - name: Render video
        run: |
          npx remotion render src/index.ts ShortVideo out/video.mp4 \
            --props="$(node -e 'const fs=require("fs");const images=JSON.parse(fs.readFileSync("out/images.json","utf8"));console.log(JSON.stringify({images}))')"
        timeout-minutes: 8
      - name: Upload video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4
      - name: Create release with video, title, description, and thumbnail
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_id }}
          name: ${{ env.VIDEO_TITLE }}
          body: ${{ env.VIDEO_DESCRIPTION }}
          files: |
            out/video.mp4
            out/thumbnail.jpg
