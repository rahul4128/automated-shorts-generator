name: Render Automated Video
on:
  repository_dispatch:
    types: [trigger-render]

# If a new render is triggered before the last one finishes, don't queue
# behind it forever — cancel the stale run instead of piling up.
concurrency:
  group: render-automated-video
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pull everything out of github.event.client_payload up front and
      # into env vars. Interpolating ${{ github.event.client_payload.* }}
      # directly into a `run:` block is both a script-injection risk and
      # the most likely cause of "gets stuck" — if the payload contains a
      # stray quote, backtick, `$(...)`, or newline, the generated shell
      # command silently breaks or waits on unmatched input instead of
      # failing fast. Referencing $SCRIPT_TEXT etc. as a quoted shell
      # variable avoids both problems.
      SCRIPT_TEXT: ${{ github.event.client_payload.scriptText }}
      IMAGE_URL: ${{ github.event.client_payload.imageUrl }}
      VIDEO_TITLE: ${{ github.event.client_payload.title }}
      VIDEO_DESCRIPTION: ${{ github.event.client_payload.description }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # setup-node's built-in `cache: npm` hard-requires a committed
          # package-lock.json/npm-shrinkwrap.json/yarn.lock and errors out
          # without one. This repo doesn't have one committed, so we cache
          # node_modules ourselves below (keyed on package.json) instead of
          # relying on this option. Commit a package-lock.json if you can —
          # it makes installs both faster and reproducible.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Same story as above: pip's cache option wants a requirements
          # file to key off of. We cache pip's download cache directly
          # below instead.

      - name: Cache node_modules and pip downloads
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/pip
          key: deps-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-

      # This runner image doesn't have ffmpeg preinstalled, and `apt-get
      # update` on this repo hit a slow/flaky azure.archive.ubuntu.com
      # mirror — that's what actually got "stuck" (4+ minutes just
      # refreshing package indexes, per the logs). Skip apt entirely and
      # grab a static ffmpeg build directly from a fast CDN instead; it's
      # a single ~80MB download with no mirror negotiation, and we cache
      # it so subsequent runs don't even pay that.
      - name: Cache static ffmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/ffmpeg-static
          key: ffmpeg-static-amd64-v1

      - name: Install ffmpeg (static binary, no apt)
        run: |
          if [ ! -x /usr/local/bin/ffmpeg-static/ffmpeg ]; then
            mkdir -p /usr/local/bin/ffmpeg-static
            curl -fL --retry 3 --retry-delay 2 --max-time 120 \
              -o /tmp/ffmpeg.tar.xz \
              "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp
            cp /tmp/ffmpeg-*-amd64-static/ffmpeg /tmp/ffmpeg-*-amd64-static/ffprobe /usr/local/bin/ffmpeg-static/
          fi
          echo "/usr/local/bin/ffmpeg-static" >> "$GITHUB_PATH"
        timeout-minutes: 3

      - name: Verify ffmpeg
        run: ffmpeg -version | head -n1

      # Cache the Piper voice model (it never changes) so it's downloaded
      # once instead of on every single run.
      - name: Cache Piper voice model
        id: cache-voice-model
        uses: actions/cache@v4
        with:
          path: models
          key: piper-voice-hi_IN-rohan-medium-v1

      - name: Download Hindi voice model
        if: steps.cache-voice-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fL --retry 3 --retry-delay 2 --max-time 120 \
            -o models/hi_IN-rohan-medium.onnx \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/rohan/medium/hi_IN-rohan-medium.onnx"
          curl -fL --retry 3 --retry-delay 2 --max-time 60 \
            -o models/hi_IN-rohan-medium.onnx.json \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/rohan/medium/hi_IN-rohan-medium.onnx.json"
        timeout-minutes: 5

      # Install JS deps and Piper TTS in parallel — they're completely
      # independent of each other and of ffmpeg/the model download above,
      # so there's no reason to make them wait in a line.
      - name: Install npm and pip dependencies (parallel)
        run: |
          set -e
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci &
          else
            npm install &
          fi
          NPM_PID=$!
          pip install --disable-pip-version-check piper-tts &
          PIP_PID=$!
          wait $NPM_PID
          wait $PIP_PID
        timeout-minutes: 6

      - name: Save thumbnail image (same image used in the video)
        run: |
          mkdir -p out
          curl -fL --retry 3 --retry-delay 2 --max-time 60 \
            -o out/thumbnail.jpg "$IMAGE_URL"
        timeout-minutes: 3

      - name: Synthesize Hindi audio with Piper
        run: |
          mkdir -p public
          printf '%s' "$SCRIPT_TEXT" | piper \
            --model models/hi_IN-rohan-medium.onnx \
            --output_file public/audio.wav
        timeout-minutes: 3

      # On first use, Remotion downloads its own headless Chromium build
      # (Chrome Headless Shell, ~100-200MB) to render with — that download
      # is a common source of a render step that looks "stuck" for
      # several minutes. Cache it so only the very first run ever pays
      # that cost.
      - name: Cache Remotion browser binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            remotion-browser-${{ runner.os }}-

      - name: Render video
        run: |
          npx remotion render src/index.ts ShortVideo out/video.mp4 \
            --props="$(node -e 'console.log(JSON.stringify({imageUrl: process.env.IMAGE_URL}))')"
        timeout-minutes: 8

      - name: Upload video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4

      - name: Create release with video, title, description, and thumbnail
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_id }}
          name: ${{ env.VIDEO_TITLE }}
          body: ${{ env.VIDEO_DESCRIPTION }}
          files: |
            out/video.mp4
            out/thumbnail.jpg
